name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go build/vet/test/race
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src/retail
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: src/retail/go.mod
          cache: false
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - name: go test
        run: go test ./...
      - name: go test -race
        run: go test -race ./...

  e2e:
    name: Loopback E2E (Linux)
    needs: go
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: src/retail/go.mod
          cache: false
      - name: e2e (retaild)
        run: python3 tests/e2e.py
      - name: e2e (retailgate)
        run: python3 tests/gate_e2e.py

  scripts:
    name: Release script syntax + SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify executable release scripts (fast fail)
        run: |
          test -x scripts/build-release.sh
          test -x scripts/package-release.sh
          test -x scripts/verify-release.sh
          test -x scripts/generate-sbom.py
          test -x packaging/linux/install.sh
          test -x packaging/linux/uninstall.sh

      - name: bash syntax
        run: |
          for script in scripts/*.sh packaging/linux/*.sh; do bash -n "$script"; done
      - name: python syntax
        run: python3 -m py_compile scripts/generate-sbom.py
      - name: installer path validation (dry-run, must refuse unsafe prefixes)
        run: |
          if bash packaging/linux/uninstall.sh --prefix / --dry-run; then
            echo "unsafe prefix was accepted"; exit 1
          fi

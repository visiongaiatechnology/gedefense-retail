name: release

# FIND-005: least-privilege CI. Workflow default is read-only; write/OIDC only
# in the publish job. Third-party actions are pinned by major tag because this
# repository cannot run an automated SHA pinning tool in this environment; the
# release gate records this limitation and expects SHA pinning as a follow-up.
#
# FIND-009: the release build is reproducible. All release artifacts come from
# ONE canonical build (build-linux) with a fixed SOURCE_DATE_EPOCH and the short
# release commit, so local and CI artifacts are byte-identical. The Windows job
# verifies Windows builds/E2E but does not produce a second artifact set.
on:
  push:
    # Strict release trigger: v<major>.<minor>.<patch>[-prerelease].
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build + package + SBOM (canonical artifact set)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Build matrix + package + SBOM (reproducible)
        run: |
          export GEDEFENSE_COMMIT="$(git rev-parse --short HEAD)"
          export SOURCE_DATE_EPOCH=1762290000
          bash scripts/build-release.sh --package
      - name: Show release checksums
        run: |
          version="$(cat VERSION)"
          cat "dist/${version}/SHA256SUMS"
          cat "dist/${version}/SHA256SUMS.archives"
          test -f "dist/${version}/SBOM.spdx.json"
      - uses: actions/upload-artifact@v4
        with:
          name: release-canonical
          path: |
            dist/**/*.tar.gz
            dist/**/*.zip
            dist/**/SHA256SUMS
            dist/**/SHA256SUMS.archives
            dist/**/SHA256SUMS.binaries
            dist/**/SBOM.spdx.json
          if-no-files-found: error

  verify-windows:
    name: Verify Windows build/E2E (no duplicate release artifacts)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Windows build/test
        shell: pwsh
        run: |
          cd src/retail
          go build ./...
          go vet ./...
          go test -count=1 ./...
      - name: Windows E2E
        shell: pwsh
        run: |
          python tests/e2e.py
          python tests/gate_e2e.py

  publish:
    name: Sign + publish GitHub release
    needs: [build-linux, verify-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-canonical
          path: release
      - name: Validate tag and release layout
        run: |
          version="$(cat VERSION)"
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
          test -f "release/SHA256SUMS" || { echo "SHA256SUMS missing"; exit 1; }
          test -f "release/SBOM.spdx.json" || { echo "SBOM missing"; exit 1; }
          ls -l release
      - name: Install cosign (keyless signing)
        # Pinned by major tag; SHA pinning limitation documented in FIND-005.
        uses: sigstore/cosign-installer@v3
      - name: Sign archives, checksums and SBOM (keyless OIDC)
        run: |
          set -euo pipefail
          cd release
          for file in *.tar.gz *.zip SHA256SUMS SHA256SUMS.archives SBOM.spdx.json; do
            test -f "$file" || { echo "sign target missing: $file"; exit 1; }
            cosign sign-blob --yes \
              --output-signature "${file}.sig" \
              --output-certificate "${file}.pem" \
              "$file"
            test -s "${file}.sig" && test -s "${file}.pem"
          done
          ls -l *.sig *.pem
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* \
              --title "GeDefense Retail ${version}" \
              --notes "Release ${version} (ALPHA, not production-approved). Verify each asset with SHA256SUMS and cosign: cosign verify-blob --signature <file>.sig --certificate <file>.pem --certificate-identity-regexp 'https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/v.*' --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' <file>. Windows binaries are NOT Authenticode-signed (documented limitation). SBOM: SBOM.spdx.json (SPDX-2.3)."
          fi

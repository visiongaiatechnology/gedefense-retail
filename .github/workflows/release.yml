name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build + package (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/retail/go.mod
          cache: true
      - name: Build matrix + package
        run: |
          bash scripts/build-release.sh --package
      - name: Show checksums
        run: cat "dist/$(cat VERSION)/SHA256SUMS.archives"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/**/*.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build + package (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/retail/go.mod
          cache: true
      - name: Build matrix + package
        shell: pwsh
        run: ./scripts/build-release.ps1 -Package
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/**/*.zip
          if-no-files-found: error

  publish:
    name: GitHub release (tag only)
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat VERSION)"
          gh release create "v${version}" \
            --title "GeDefense Retail ${version}" \
            --notes "Release ${version}. Verify downloads with SHA256SUMS.archives. Alpha quality: see docs/BUILD-AND-RELEASE.md." \
            artifacts/release-linux/*.tar.gz \
            artifacts/release-windows/*.zip
